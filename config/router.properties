# Router 配置文件

# 基础配置
router.id = router-001

# 服务配置
server.listen_host = 0.0.0.0
server.listen_port = 9090
server.io_threads = 8

# 管控平台配置
control.platform.host = 127.0.0.1
control.platform.port = 8080

# Kafka 集群配置示例
# 支持多个不同版本的 Kafka 集群
mq.kafka.cluster.kafka-cluster-1.brokers = 127.0.0.1:9092,127.0.0.1:9093
mq.kafka.cluster.kafka-cluster-1.version = 3.x
mq.kafka.cluster.kafka-cluster-1.props.compression.type = snappy

# Kafka 集群 2（旧版本示例）
# mq.kafka.cluster.kafka-cluster-2.brokers = kafka-legacy:9092
# mq.kafka.cluster.kafka-cluster-2.version = 0.11
# mq.kafka.cluster.kafka-cluster-2.props.compression.type = gzip

# RabbitMQ 集群配置示例
# mq.rabbitmq.cluster.rabbit-cluster-1.hosts = 127.0.0.1:5672
# mq.rabbitmq.cluster.rabbit-cluster-1.version = 4.x

# Pulsar 集群配置示例
# mq.pulsar.cluster.pulsar-cluster-1.url = pulsar://127.0.0.1:6650
# mq.pulsar.cluster.pulsar-cluster-1.version = 3.x

# 反压控制
backpressure.session_buffer_high_watermark_mb = 64
backpressure.session_buffer_low_watermark_mb = 32

# 指标配置
metrics.prometheus_listen = 0.0.0.0:9101

# Monitor 服务配置（接收监控数据）
monitor.host = 127.0.0.1
monitor.port = 9200
monitor.send_interval_sec = 10
