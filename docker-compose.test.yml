version: '3.8'

services:
  # ZooKeeper 用于 Agent 注册和监控
  zookeeper:
    image: zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      ZOO_CFG_EXTRA: "server.1=0.0.0.0:2888:3888"
      ZOO_PORT: 2181
    networks:
      - log-pipeline-test
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka 消息队列
  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - log-pipeline-test
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 管控平台（模拟服务）
  control-platform:
    image: kennethreitz/httpbin
    ports:
      - "8080:80"
    networks:
      - log-pipeline-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status/200"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Monitor 服务（模拟服务）
  monitor:
    image: kennethreitz/httpbin
    ports:
      - "9200:80"
    networks:
      - log-pipeline-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status/200"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Log Router 实例
  router:
    build:
      context: .
      dockerfile: Dockerfile
      target: router
    depends_on:
      zookeeper:
        condition: service_healthy
      kafka:
        condition: service_healthy
      control-platform:
        condition: service_healthy
    environment:
      ROUTER_ID: router-001
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: 9090
      IO_THREADS: 4
      CONTROL_PLATFORM_HOST: control-platform
      CONTROL_PLATFORM_PORT: 80
      KAFKA_BROKERS: kafka:29092
      MONITOR_HOST: monitor
      MONITOR_PORT: 80
    ports:
      - "9090:9090"
      - "9101:9101"
    volumes:
      - router-data-test:/var/lib/log-router
      - ./config:/etc/log-pipeline:ro
    networks:
      - log-pipeline-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9101/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  router-data-test:

networks:
  log-pipeline-test:
    driver: bridge

